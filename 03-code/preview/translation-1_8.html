<script>
const DATA = {"workNo":"1.8","docTitle":"The Contract Net Protocol: High-Level Communication and Control in a Distributed Problem Solver","docTitleZh":"合同网协议：分布式问题求解器中的高层通信与控制","engine":"qwen","model":"qwen-plus","tgtLang":"zh-CN","stats":{"pages":3,"segs":77,"srcChars":17168,"dstChars":5841},"pages":[{"pageNo":1,"paras":[{"text":"1 104","src":"1 104","dst":"","role":"figure-label","tier":"small","align":"left","passthrough":true},{"text":"The Contract Net Protocol: High-Level Communication and Control in a Distributed Problem Solver","src":"The Contract Net Protocol: High-Level Communication and Control in a Distributed Problem Solver","dst":"合同网协议：分布式问题求解器中的高层通信与控制","role":"title","tier":"h1","align":"center","passthrough":false},{"text":"REID G. SMITH, MEMBER, IEEE","src":"REID G. SMITH, MEMBER, IEEE","dst":"雷德·G·史密斯（Reid G. Smith），IEEE 会员","role":"section","tier":"h2","align":"center","passthrough":false},{"text":"Abstract-The contract net protocol has been developed to specify problem-solving communication and control for nodes in a distributed problem solver. Task distribution is'affected by a negotiation process, a discussion carried on between nodes with tasks to be executed and nodes that may be able to execute those tasks.","src":"Abstract-The contract net protocol has been developed to specify problem-solving communication and control for nodes in a distributed problem solver. Task distribution is'affected by a negotiation process, a discussion carried on between nodes with tasks to be executed and nodes that may be able to execute those tasks.","dst":"摘要：合同网协议旨在为分布式问题求解器中各节点的问题求解通信与控制行为提供形式化规范。任务分配通过一种协商过程实现，即由承担待执行任务的节点与可能具备执行能力的节点之间展开的讨论。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"We present the specification of the protocol and demonstrate its use in the solution of a problem in distributed sensing.","src":"We present the specification of the protocol and demonstrate its use in the solution of a problem in distributed sensing.","dst":"本文给出了该协议的形式化规范，并以分布式感知领域的一个具体问题求解为例，展示其应用方式。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"The utility of negotiation as an interaction mechanism is discussed. It can be used to achieve different goals, such as distributing control and data to avoid bottlenecks and enabling a finer degree of control in making resource allocation and focus decisions than is possible with traditional mechanisms.","src":"The utility of negotiation as an interaction mechanism is discussed. It can be used to achieve different goals, such as distributing control and data to avoid bottlenecks and enabling a finer degree of control in making resource allocation and focus decisions than is possible with traditional mechanisms.","dst":"本文探讨了协商作为一种交互机制的有效性：它可用于实现多种目标，例如通过分散控制权与数据流来避免系统瓶颈，以及在资源分配与焦点决策中实现比传统机制更为精细的调控能力。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"Index Terms-Artificial Intelligence (Al), connection, cooperation, distributed problem solving, focus, high-level protocols, negotiation, resource allocation, task-sharing.","src":"Index Terms-Artificial Intelligence (Al), connection, cooperation, distributed problem solving, focus, high-level protocols, negotiation, resource allocation, task-sharing.","dst":"索引词：人工智能（Artificial Intelligence, AI）、连接、协作、分布式问题求解、焦点、高层协议、协商、资源分配、任务共享。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"I. INTRODUCTION","src":"I. INTRODUCTION","dst":"I. 引言","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"DISTRIBUTED problem solving is the cooperative solution of problems by a decentralized and loosely coupled collection of knowledge-sources (KS's) (procedures, sets of production rules, etc.), located in a number of distinct processor nodes. The KS's cooperate in the sense that no one of them has sufficient information to solve the entire problem; mutual sharing of information is necessary to allow the group, as a whole, to produce an answer.","src":"DISTRIBUTED problem solving is the cooperative solution of problems by a decentralized and loosely coupled collection of knowledge-sources (KS's) (procedures, sets of production rules, etc.), located in a number of distinct processor nodes. The KS's cooperate in the sense that no one of them has sufficient information to solve the entire problem; mutual sharing of information is necessary to allow the group, as a whole, to produce an answer.","dst":"分布式问题求解是指由一组去中心化、松散耦合的知识源（Knowledge Sources, KS）协同完成问题求解的过程；这些知识源（如过程性程序、产生式规则集等）分布于多个独立的处理器节点之上。所谓“协同”，是指其中任一知识源均无法单独掌握足够信息以解决整个问题；唯有通过相互共享信息，该群体作为一个整体才能得出解答。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"By decentralized we mean that both control and data are logically and often geographically distributed; there is neither global control nor global data storage. Loosely coupled means that individual KS's spend most of their time in computation rather than communication.","src":"By decentralized we mean that both control and data are logically and often geographically distributed; there is neither global control nor global data storage. Loosely coupled means that individual KS's spend most of their time in computation rather than communication.","dst":"“去中心化”意味着控制权与数据在逻辑上（且常常在地理上）均呈分布式布局：既不存在全局性的控制机制，也不存在全局性的数据存储。“松散耦合”则指各知识源大部分时间用于本地计算，而非通信交互。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"Such problem solvers offer the promise of speed, reliability, extensibility, and the potential for increased tolerance to uncertain data and knowledge, as well as the ability to handle applications with a natural spatial distribution. There has been much recent interest in this type of problem solving in the Artificial Intelligence (Al) community. Its use has been con-","src":"Such problem solvers offer the promise of speed, reliability, extensibility, and the potential for increased tolerance to uncertain data and knowledge, as well as the ability to handle applications with a natural spatial distribution. There has been much recent interest in this type of problem solving in the Artificial Intelligence (Al) community. Its use has been con-","dst":"此类问题求解系统有望在运算速度、系统可靠性、可扩展性，以及对不确定数据与知识的容错能力等方面展现出优势，同时也更适用于天然具有空间分布特征的应用场景。近年来，人工智能（Artificial Intelligence, AI）领域对此类问题求解方式表现出浓厚兴趣。其应用已得到——","role":"body","tier":"body","align":"left","passthrough":false},{"text":"Manuscript received March 4, 1980; revised May 9, 1980. This work was supported in part by the Advanced Research Projects Agency under Contract MDA 903-77-C-0322, the National Science Foundation under Contract MCS 77-02712, and the National Institutes of Health under Grant RR-00785 on the SUMEX-AIM Computer Facility at Stanford University, Stanford, CA and by the Defence Research Establishment Atlantic of the Department of National Defence, Research and Development Branch, Dartmouth, N.S. Canada.","src":"Manuscript received March 4, 1980; revised May 9, 1980. This work was supported in part by the Advanced Research Projects Agency under Contract MDA 903-77-C-0322, the National Science Foundation under Contract MCS 77-02712, and the National Institutes of Health under Grant RR-00785 on the SUMEX-AIM Computer Facility at Stanford University, Stanford, CA and by the Defence Research Establishment Atlantic of the Department of National Defence, Research and Development Branch, Dartmouth, N.S. Canada.","dst":"手稿收稿日期：1980年3月4日；修订日期：1980年5月9日。本研究工作部分得到以下机构资助：美国高级研究计划局（Advanced Research Projects Agency）合同号MDA 903-77-C-0322；美国国家科学基金会（National Science Foundation）合同号MCS 77-02712；美国国立卫生研究院（National Institutes of Health）资助号RR-00785（资助对象为斯坦福大学（加利福尼亚州斯坦福市）SUMEX-AIM计算机设施）；以及加拿大国防部（Department of National Defence）研究与发展分部大西洋国防研究机构（Defence Research Establishment Atlantic），新斯科舍省达特茅斯市。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"The author is with the Defence Research Establishment Atlantic, Dartmouth, N.S., Canada.","src":"The author is with the Defence Research Establishment Atlantic, Dartmouth, N.S., Canada.","dst":"作者任职于加拿大新斯科舍省达特茅斯市大西洋国防研究机构（Defence Research Establishment Atlantic）。","role":"footnote","tier":"small","align":"left","passthrough":false},{"text":"sidered in such applications as traffic-light control [5], distributed sensing [7], and heuristic search [10].","src":"sidered in such applications as traffic-light control [5], distributed sensing [7], and heuristic search [10].","dst":"此类应用包括交通信号灯控制［5］、分布式传感［7］以及启发式搜索［10］。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"In this paper, we present the contract net protocol, a highlevel protocol for communication among the nodes in a distributed problem solver. It facilitates distributed control of cooperative task execution (which we call task-sharing [9]) with efficient internode communication.","src":"In this paper, we present the contract net protocol, a highlevel protocol for communication among the nodes in a distributed problem solver. It facilitates distributed control of cooperative task execution (which we call task-sharing [9]) with efficient internode communication.","dst":"本文提出合同网协议（Contract Net Protocol），这是一种面向分布式问题求解器中各节点间通信的高层协议。该协议支持协作式任务执行的分布式控制（我们称之为“任务共享”［9］），并实现节点间高效通信。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"The role of a high-level protocol in a network such as the ARPANET has been discussed in previous papers (see, for example [ 1]). Traditional communication protocols form a low-level base for problem-solving communication. They enable reliable and efficient transmission of bit streams between nodes, but do not consider the semantics of the information being passed. A high-level protocol assigns interpretations to the bit streams. It offers a structure that assists the system designer in deciding what the nodes should say to each other, rather than how to say it.","src":"The role of a high-level protocol in a network such as the ARPANET has been discussed in previous papers (see, for example [ 1]). Traditional communication protocols form a low-level base for problem-solving communication. They enable reliable and efficient transmission of bit streams between nodes, but do not consider the semantics of the information being passed. A high-level protocol assigns interpretations to the bit streams. It offers a structure that assists the system designer in deciding what the nodes should say to each other, rather than how to say it.","dst":"高层协议在网络（如ARPANET）中的作用，此前已有论文讨论（参见例如［1］）。传统通信协议构成问题求解通信的底层基础：它们保障节点之间比特流传输的可靠性与高效性，但不涉及所传递信息的语义。而高层协议则为比特流赋予语义解释，提供一种结构化框架，协助系统设计者决定各节点“应说什么”，而非“如何说”。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"We are not primarily concerned with the physical architecture of the problem solver. It is assumed to be a network of loosely coupled, asynchronous nodes. Each node contains a number of distinct KS's. The nodes are interconnected so that each node can communicate with every other node by sending messages. No memory is shared by the nodes. We also assume the existence of a low-level communication protocol to support reliable and efficient communication of bit streams between nodes. A functional model of a node is shown in Appendix A.","src":"We are not primarily concerned with the physical architecture of the problem solver. It is assumed to be a network of loosely coupled, asynchronous nodes. Each node contains a number of distinct KS's. The nodes are interconnected so that each node can communicate with every other node by sending messages. No memory is shared by the nodes. We also assume the existence of a low-level communication protocol to support reliable and efficient communication of bit streams between nodes. A functional model of a node is shown in Appendix A.","dst":"我们主要关注的并非问题求解器的物理架构。我们假定其为一个由松散耦合、异步运行的节点构成的网络；每个节点内部包含若干彼此独立的知识源（KS）；各节点相互连通，使得任一节点均可通过发送消息与其他所有节点通信；节点之间不共享内存。此外，我们还假设存在一种底层通信协议，用以支持节点间比特流传输的可靠性与高效性。节点的功能模型见附录A。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"II. CONNECTION AND CONTRACT NEGOTIATION","src":"II. CONNECTION AND CONTRACT NEGOTIATION","dst":"II. 连接与合同协商","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"The key issue to be resolved in task-sharing is how tasks are to be distributed among the processor nodes. There must be a means whereby nodes with tasks to be executed can find the most appropriate idle nodes to execute those tasks. We call this the connection problem. Solving the connection problem is crucial to high performance in a distributed problem solver. It has two aspects: 1) resource allocation and 2) focus. Effective resource allocation is achieved by balancing the computational load among the nodes.","src":"The key issue to be resolved in task-sharing is how tasks are to be distributed among the processor nodes. There must be a means whereby nodes with tasks to be executed can find the most appropriate idle nodes to execute those tasks. We call this the connection problem. Solving the connection problem is crucial to high performance in a distributed problem solver. It has two aspects: 1) resource allocation and 2) focus. Effective resource allocation is achieved by balancing the computational load among the nodes.","dst":"任务共享中亟需解决的核心问题是：任务如何在处理器节点之间进行分配？必须建立一种机制，使拥有待执行任务的节点能够找到最适宜执行这些任务的空闲节点。我们将此称为“连接问题”。解决连接问题对分布式问题求解器的高性能至关重要，它包含两个方面：1）资源分配；2）焦点集中。有效的资源分配通过在各节点间均衡计算负载来实现。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"It is essential if the maximum speedup possible from applying multiple nodes to a single overall problem is to be obtained.","src":"It is essential if the maximum speedup possible from applying multiple nodes to a single overall problem is to be obtained.","dst":"若希望在将多个节点应用于同一整体问题时获得可能的最大加速比，则此机制至关重要。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"Focus is achieved by effective selection of tasks for allocation to nodes and by effective selection of KS's for execution of tasks. It is essential for problems that do not have well-defined","src":"Focus is achieved by effective selection of tasks for allocation to nodes and by effective selection of KS's for execution of tasks. It is essential for problems that do not have well-defined","dst":"聚焦性通过任务向节点的有效分配，以及知识源（KS）对任务执行的有效选择来实现。对于那些缺乏明确定义求解算法的问题（即人工智能领域中最常研究的此类问题），该机制尤为关键。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"©) 1980 Canadian Crown Copyright","src":"©) 1980 Canadian Crown Copyright","dst":"","role":"figure-label","tier":"small","align":"left","passthrough":true}]},{"pageNo":2,"paras":[{"text":"algorithms for their solutions (i.e., problems of the type most often considered in Al). For such problems, many tasks are typically generated during the search for solutions; and the execution of many of these tasks will not lead to a solution. In addition, the most appropriate KS to invoke for the execution of any given task generally cannot be identified a priori. The combination of many tasks and many applicable KS's can lead to a combinatorial explosion. A problem solver must therefore maintain focus to achieve high performance in practical applications.","src":"algorithms for their solutions (i.e., problems of the type most often considered in Al). For such problems, many tasks are typically generated during the search for solutions; and the execution of many of these tasks will not lead to a solution. In addition, the most appropriate KS to invoke for the execution of any given task generally cannot be identified a priori. The combination of many tasks and many applicable KS's can lead to a combinatorial explosion. A problem solver must therefore maintain focus to achieve high performance in practical applications.","dst":"此类问题在求解搜索过程中通常会生成大量任务；而其中许多任务的执行并不能导向最终解。此外，针对任一给定任务，最适宜调用的知识源（KS）通常无法事先确定。大量任务与大量可适用知识源（KS）的组合，可能导致组合爆炸。因此，问题求解器必须维持聚焦性，方能在实际应用中实现高性能。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"The connection problem can also be viewed from the perspective of an idle node. It must find another node with an appropriate task that is available for execution. In our approach, both nodes with tasks to be executed and nodes ready to execute tasks proceed simultaneously. They engage each other in discussions that resemble contract negotiation to solve the connection problem. It is this process that is the basis for the contract net protocol.","src":"The connection problem can also be viewed from the perspective of an idle node. It must find another node with an appropriate task that is available for execution. In our approach, both nodes with tasks to be executed and nodes ready to execute tasks proceed simultaneously. They engage each other in discussions that resemble contract negotiation to solve the connection problem. It is this process that is the basis for the contract net protocol.","dst":"连接问题亦可从空闲节点的视角加以审视：它必须主动寻找到另一个拥有合适且可供执行任务的节点。在我们的方法中，既包含待执行任务的节点，也包含准备就绪、可执行任务的节点，二者同步运行，并通过类似合同谈判的交互式协商来解决连接问题。这一过程正是合同网协议的基础。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"For our purposes, negotiation has four important components: 1) it is a local process that does not involve centralized control, 2) there is a two-way exchange of information, 3) each party to the negotiation evaluates the information from its own perspective, and 4) final agreement is achieved by mutual selection.","src":"For our purposes, negotiation has four important components: 1) it is a local process that does not involve centralized control, 2) there is a two-way exchange of information, 3) each party to the negotiation evaluates the information from its own perspective, and 4) final agreement is achieved by mutual selection.","dst":"就我们的目的而言，协商包含四个重要要素：1）它是一种不依赖集中式控制的本地化过程；2）信息以双向方式交换；3）协商各方均基于自身立场独立评估所获信息；4）最终协议通过双方相互选择达成。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"The collection of nodes is referred to as a contract net and the execution of a task is dealt with as a contract between two nodes. Each node in the net takes on one of two roles related to the execution of an individual task: manager or contractor. A manager is responsible for monitoring the execution of a task and processing the results of its execution. A contractor is responsible for the actual execution of the task.","src":"The collection of nodes is referred to as a contract net and the execution of a task is dealt with as a contract between two nodes. Each node in the net takes on one of two roles related to the execution of an individual task: manager or contractor. A manager is responsible for monitoring the execution of a task and processing the results of its execution. A contractor is responsible for the actual execution of the task.","dst":"节点集合被称为合同网（contract net），而任务的执行则被视作两个节点之间缔结的一份合同。网络中的每个节点在单个任务的执行过程中承担以下两种角色之一：管理者（manager）或承包者（contractor）。管理者负责监控任务的执行过程并处理其执行结果；承包者则负责任务的实际执行。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"Individual nodes are not designated a priori as managers or contractors; these are only roles, and any node can take on either role dynamically during the course of problem solving. Typically, a node will take on both roles, often simultaneously for different contracts. As a result, nodes are not statically tied to a control hierarchy. This also leads to more efficient utilization of nodes, as compared, for example, to schemes that do not allow nodes that have contracted out tasks to take on other tasks while they are waiting for results.","src":"Individual nodes are not designated a priori as managers or contractors; these are only roles, and any node can take on either role dynamically during the course of problem solving. Typically, a node will take on both roles, often simultaneously for different contracts. As a result, nodes are not statically tied to a control hierarchy. This also leads to more efficient utilization of nodes, as compared, for example, to schemes that do not allow nodes that have contracted out tasks to take on other tasks while they are waiting for results.","dst":"各节点在问题求解前并未被预先指定为管理者或承包商；管理者与承包商仅为动态角色，任一节点均可在求解过程中根据需要动态承担其中任一角色。通常情况下，一个节点会同时承担两种角色，且往往针对不同的合同并行履行。因此，节点并不静态地隶属于某一控制层级。这种机制亦能更高效地利用各节点资源——例如，相较于那些不允许已外包任务的节点在等待结果期间承接其他任务的方案，本机制显著提升了节点利用率。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"A contract is established by a process of local mutual selection based on a two-way transfer of information. In brief, available contractors evaluate task announcements made by several managers and submit bids on those for which they are suited. The managers evaluate the bids and award contracts to the nodes they determine to be most appropriate. The negotiation process may then recur. A contractor may further partition a task and award contracts to other nodes. It is then the manager for those contracts. This leads to the hierarchical control structure that is typical of task-sharing.","src":"A contract is established by a process of local mutual selection based on a two-way transfer of information. In brief, available contractors evaluate task announcements made by several managers and submit bids on those for which they are suited. The managers evaluate the bids and award contracts to the nodes they determine to be most appropriate. The negotiation process may then recur. A contractor may further partition a task and award contracts to other nodes. It is then the manager for those contracts. This leads to the hierarchical control structure that is typical of task-sharing.","dst":"合同通过一种基于双向信息交换的本地化互选过程建立。简言之，可用的承包商评估若干管理者发布的任务通告，并就自身适配的任务提交投标；管理者则对各项投标进行评估，并将合同授予其判定最为合适的节点。该协商过程可反复进行：某承包商还可进一步将所承接任务分解，并向其他节点分包，此时它便成为这些子合同的管理者。由此形成任务共享中典型的层次化控制结构。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"Control is distributed because processing and communication are not focused at particular nodes, but rather every node is capable of accepting and assigning tasks.","src":"Control is distributed because processing and communication are not focused at particular nodes, but rather every node is capable of accepting and assigning tasks.","dst":"控制是分布式的，因为处理与通信并非集中于特定节点，而是每个节点均具备接受与分配任务的能力。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"The basic idea of contracting is not new. A rudimentary bidding scheme, for example, was used for resource allocation in the distributed computing system (DCS) [2], [3]. We will note the similarities and differences between that scheme and the contract net protocol as we proceed.","src":"The basic idea of contracting is not new. A rudimentary bidding scheme, for example, was used for resource allocation in the distributed computing system (DCS) [2], [3]. We will note the similarities and differences between that scheme and the contract net protocol as we proceed.","dst":"“合同”这一基本思想并非新创。例如，在分布式计算系统（DCS）[2], [3] 的资源分配中，曾采用过一种初级的竞标机制。后文在展开论述时，将指出该机制与合同网协议之间的异同。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"1 105","src":"1 105","dst":"","role":"figure-label","tier":"small","align":"left","passthrough":true},{"text":"Throughout the paper, reference is made to an experimental contract net system called CNET. It is a system of INTERLISP [12] functions that enables a user to simulate the solution of problems with a distributed processor.","src":"Throughout the paper, reference is made to an experimental contract net system called CNET. It is a system of INTERLISP [12] functions that enables a user to simulate the solution of problems with a distributed processor.","dst":"全文所述及的实验性合同网系统名为 CNET。它是一组基于 INTERLISP [12] 的函数，支持用户模拟在分布式处理器环境下求解问题的过程。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"III. EXAMPLE","src":"III. EXAMPLE","dst":"III. 示例","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"This example is taken from a CNET simulation of a distributed sensing system (DSS) [7]. A DSS is a network of sensor and processor nodes spread throughout a relatively large geographic area. It attempts to construct and maintain a dynamic map of vehicle traffic in the area. Construction and maintenance of such a map requires the interpretation and integration of a large quantity of sensory information received by the collection of sensor elements.","src":"This example is taken from a CNET simulation of a distributed sensing system (DSS) [7]. A DSS is a network of sensor and processor nodes spread throughout a relatively large geographic area. It attempts to construct and maintain a dynamic map of vehicle traffic in the area. Construction and maintenance of such a map requires the interpretation and integration of a large quantity of sensory information received by the collection of sensor elements.","dst":"本例取自分布式感知系统（Distributed Sensing System, DSS）[7] 的合同网协议（Contract Net Protocol, CNET）仿真。DSS 是一种由传感器节点与处理器节点构成的网络，这些节点分布于相对广阔的地理区域内，其目标是构建并持续维护该区域内的车辆交通动态地图。此类地图的构建与维护需对大量由各传感器单元所采集的感知信息进行解释与融合。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"Use of the contract net protocol in a DSS makes it possible for the sensor system to be configured dynamically, taking into account such factors as the number of sensor and processor nodes available, their locations, and the ease with which communication can be established.","src":"Use of the contract net protocol in a DSS makes it possible for the sensor system to be configured dynamically, taking into account such factors as the number of sensor and processor nodes available, their locations, and the ease with which communication can be established.","dst":"在 DSS 中采用合同网协议，可实现传感器系统的动态配置，充分考虑可用传感器节点与处理器节点的数量、空间位置，以及通信链路建立的难易程度等因素。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"We will examine the negotiation for one particular task, called the signal task, that arises during the initialization phase of DSS operation. The task involves gathering of sensed data and extraction of signal features. The managers for this task are nodes that do not have sensing capabilities, but do have extensive processing capabilities. They attempt to find a set of sensor nodes to provide them with signal features.","src":"We will examine the negotiation for one particular task, called the signal task, that arises during the initialization phase of DSS operation. The task involves gathering of sensed data and extraction of signal features. The managers for this task are nodes that do not have sensing capabilities, but do have extensive processing capabilities. They attempt to find a set of sensor nodes to provide them with signal features.","dst":"我们将考察 DSS 运行初始化阶段出现的一项特定任务——“信号任务”（signal task）——所涉及的协商过程。该任务包括采集感知数据及从中提取信号特征。负责此项任务的管理者（managers）是一类不具备感知能力但具备强大处理能力的节点；它们试图寻找一组传感器节点，以获取所需的信号特征。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"The sensor nodes, on the other hand, have limited processing capabilities and attempt to find managers that can further process the signal features they extract from the raw sensed data.","src":"The sensor nodes, on the other hand, have limited processing capabilities and attempt to find managers that can further process the signal features they extract from the raw sensed data.","dst":"相反，传感器节点自身的处理能力有限，因而致力于寻找能够对其从原始感知数据中提取的信号特征作进一步处理的管理者。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"Recall that we view node interaction as an agreement between a node with a task to be performed and a node capable of performing that task. Sometimes the perspective on the ideal character of that agreement differs depending on the point of view of the participant. For example, from the perspective of the signal task managers, the best set of contractors has an adequate spatial distribution about the surrounding area and an adequate distribution of sensor types.","src":"Recall that we view node interaction as an agreement between a node with a task to be performed and a node capable of performing that task. Sometimes the perspective on the ideal character of that agreement differs depending on the point of view of the participant. For example, from the perspective of the signal task managers, the best set of contractors has an adequate spatial distribution about the surrounding area and an adequate distribution of sensor types.","dst":"需回顾的是，我们将节点间的交互视作一项协议：一方是拥有待执行任务的节点，另一方则是具备执行该任务能力的节点。而对这一协议理想形态的理解，往往因参与方视角不同而有所差异。例如，从信号任务管理者的角度看，最优的承包商（contractors）集合应具备足够的空间分布覆盖周边区域，并具备足够多样的传感器类型分布。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"From the point of view of the signal task contractors, on the other hand, the best managers are those closest to them in order to minimize potential communication problems. The ability to express and deal with such disparate viewpoints is one advantage of the contract net protocol. To see how the appropriate resolution is accomplished, consider the messages exchanged between the signal managers and potential signal contractors. Each signal manager announces its own signal task, using a message of the sort shown in Fig. 1.","src":"From the point of view of the signal task contractors, on the other hand, the best managers are those closest to them in order to minimize potential communication problems. The ability to express and deal with such disparate viewpoints is one advantage of the contract net protocol. To see how the appropriate resolution is accomplished, consider the messages exchanged between the signal managers and potential signal contractors. Each signal manager announces its own signal task, using a message of the sort shown in Fig. 1.","dst":"而从信号任务承包商的角度看，最优的管理者则是地理位置上距离自身最近者，以便最大限度降低潜在的通信问题。合同网协议的一大优势，正在于它能够清晰表达并协调此类相互冲突的立场。为理解该协议如何实现恰当的协调，我们考察信号管理者与潜在信号承包商之间交换的消息：每位信号管理者均通过如图 1 所示格式的消息，发布自身承担的信号任务。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"Each message in the contract net protocol has a set of slots for the task-specific information in the message. The four slots of the task announcement are shown in the figure. The information that fills the slots is encoded in a simple language common to all nodes.","src":"Each message in the contract net protocol has a set of slots for the task-specific information in the message. The four slots of the task announcement are shown in the figure. The information that fills the slots is encoded in a simple language common to all nodes.","dst":"合同网协议中的每条消息均包含一组用于承载任务特有信息的槽位。图中展示了任务公告所含的四个槽位。填充这些槽位的信息采用一种所有节点共用的简易语言进行编码。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"The task abstraction is the type of task and the position of the manager making the announcement. The position enables a potential contractor to determine the manager to which it should respond. The eligibility specification indicates that the only nodes that should bid on this task are those which 1) have sensing capabilities and 2) are located in the same area as the manager that announced the task. This helps to reduce extraneous message traffic and bid processing. The bid specifi-","src":"The task abstraction is the type of task and the position of the manager making the announcement. The position enables a potential contractor to determine the manager to which it should respond. The eligibility specification indicates that the only nodes that should bid on this task are those which 1) have sensing capabilities and 2) are located in the same area as the manager that announced the task. This helps to reduce extraneous message traffic and bid processing. The bid specifi-","dst":"任务抽象包括任务类型以及发布该任务公告的管理者所在位置。该位置信息使潜在承包方可据此确定应向哪一位管理者作出响应。资格说明则指出：仅有同时满足以下两个条件的节点才可对该任务进行投标：1）具备感知能力；2）与发布任务的管理者位于同一区域。此举有助于减少冗余的消息通信量及投标处理负担。投标规范—","role":"body","tier":"body","align":"left","passthrough":false}]},{"pageNo":3,"paras":[{"text":"1106","src":"1106","dst":"","role":"figure-label","tier":"small","align":"left","passthrough":true},{"text":"To: * indicates a broadcast message.","src":"To: * indicates a broadcast message.","dst":"收件人（To）：* 表示广播消息。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"From: 25","src":"From: 25","dst":"","role":"figure-label","tier":"small","align":"left","passthrough":true},{"text":"Type: TASK ANNOUNCEMENT","src":"Type: TASK ANNOUNCEMENT","dst":"","role":"figure-label","tier":"small","align":"left","passthrough":true},{"text":"Contract: 22-3-1","src":"Contract: 22-3-1","dst":"","role":"figure-label","tier":"small","align":"left","passthrough":true},{"text":"Task Abstraction:","src":"Task Abstraction:","dst":"任务抽象：","role":"body","tier":"body","align":"left","passthrough":false},{"text":"TASK TYPE SIGNAL","src":"TASK TYPE SIGNAL","dst":"任务类型（TASK TYPE）：SIGNAL","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"POSITION LAT 47N LONG 17E","src":"POSITION LAT 47N LONG 17E","dst":"位置（POSITION）：纬度 47°N，经度 17°E","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"Eligibility Specification:","src":"Eligibility Specification:","dst":"资格要求说明","role":"body","tier":"body","align":"left","passthrough":false},{"text":"MUST-HAVE SENSOR","src":"MUST-HAVE SENSOR","dst":"","role":"figure-label","tier":"small","align":"left","passthrough":true},{"text":"MUST-HAVE POSITION AREA A","src":"MUST-HAVE POSITION AREA A","dst":"必备职位区域 A","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"Bid Specification:","src":"Bid Specification:","dst":"投标要求说明","role":"body","tier":"body","align":"left","passthrough":false},{"text":"POSITION LAT LONG","src":"POSITION LAT LONG","dst":"职位经纬度","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"EVERY SENSOR NAME TYPE","src":"EVERY SENSOR NAME TYPE","dst":"所有传感器名称及类型","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"Expiration Time:","src":"Expiration Time:","dst":"失效时间","role":"body","tier":"body","align":"left","passthrough":false},{"text":"28 1730Z FEB 1979","src":"28 1730Z FEB 1979","dst":"","role":"figure-label","tier":"small","align":"left","passthrough":true},{"text":"Fig. 1. Signal task announcement.","src":"Fig. 1. Signal task announcement.","dst":"图1：信号任务公告。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"cation indicates the information that a manager needs to select a suitable set of sensor nodes-the position of the bidder and the name and type of each of its sensors. Finally, the expiration time is a deadline for receiving bids.","src":"cation indicates the information that a manager needs to select a suitable set of sensor nodes-the position of the bidder and the name and type of each of its sensors. Finally, the expiration time is a deadline for receiving bids.","dst":"该公告包含管理者为遴选合适传感器节点集所需的信息——投标者的地理位置，以及其所配备各传感器的名称与类型。最后，截止时间即为接收投标的最后期限。","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"Each potential contractor listens to the task announcements made by signal managers. It ranks each announcement relative to the others thus far received, according to the distance to the manager. Just before the deadline for the task announcement associated with the perceived nearest manager, the node submits a bid (Fig. 2). The bid message supplies the position of the bidder and a description of its sensors.","src":"Each potential contractor listens to the task announcements made by signal managers. It ranks each announcement relative to the others thus far received, according to the distance to the manager. Just before the deadline for the task announcement associated with the perceived nearest manager, the node submits a bid (Fig. 2). The bid message supplies the position of the bidder and a description of its sensors.","dst":"每个潜在承包商持续监听信号管理者发布的任务公告，并依据自身到各管理者的距离，对迄今接收到的所有公告进行相对排序；在感知到的最近管理者所发布任务公告的截止时间前，该节点提交投标（图2）。投标消息中提供投标者的地理位置及其所配备传感器的描述。","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"A manager uses this information to select a set of bidders that covers its area of responsibility with a suitable variety of sensors, and then awards a signal contract on this basis (Fig. 3). The award message specifies the sensors that a contractor must use to provide signal-feature data to its manager.","src":"A manager uses this information to select a set of bidders that covers its area of responsibility with a suitable variety of sensors, and then awards a signal contract on this basis (Fig. 3). The award message specifies the sensors that a contractor must use to provide signal-feature data to its manager.","dst":"管理者利用该信息，遴选一组能以其传感器类型的适当多样性覆盖自身责任区域的投标者，并据此授予信号合同（图3）。授标消息明确指定承包商须调用哪些传感器，以向其管理者提供信号特征数据。","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"IV. THE CONTRACT NET PROTOCOL We now describe the messages of the protocol and the encoding of information in their slots. We also describe the processing of each message. The BNF specification of the protocol is presented in Appendix B. The reader may find it helpful to refer to the specification while reading the following sections.","src":"IV. THE CONTRACT NET PROTOCOL We now describe the messages of the protocol and the encoding of information in their slots. We also describe the processing of each message. The BNF specification of the protocol is presented in Appendix B. The reader may find it helpful to refer to the specification while reading the following sections.","dst":"四、合同网协议\n接下来，我们阐述该协议所涉消息的结构、各消息字段中信息的编码方式，以及每类消息的处理流程。协议的BNF形式化规范见附录B。读者在阅读后续章节时，可参考该规范以助理解。","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"A. The Basic Messages","src":"A. The Basic Messages","dst":"A. 基本消息","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"1) Task Announcements A node that generates a task normally initiates contract negotiation by advertising existence of that task to the other nodes with a task announcement message. It then acts as the manager of the task. A task announcement can be addressed to all nodes in the net (general broadcast), to a subset of nodes (limited broadcast), or to a single node (point-to-point). The latter two modes of addressing, which we call focused addressing, reduce message processing overhead by allowing nonaddressed nodes to ignore task announcements after examining only the addressee slot.","src":"1) Task Announcements A node that generates a task normally initiates contract negotiation by advertising existence of that task to the other nodes with a task announcement message. It then acts as the manager of the task. A task announcement can be addressed to all nodes in the net (general broadcast), to a subset of nodes (limited broadcast), or to a single node (point-to-point). The latter two modes of addressing, which we call focused addressing, reduce message processing overhead by allowing nonaddressed nodes to ignore task announcements after examining only the addressee slot.","dst":"1）任务通告：生成任务的节点通常通过向其他节点发送任务通告消息（task announcement message），宣告该任务的存在，从而启动合同协商过程；此后，该节点即作为该任务的管理者。任务通告可面向网络中所有节点（泛洪广播）、面向部分节点（受限广播），或仅面向单个节点（点对点通信）。后两种寻址方式（我们称之为“聚焦式寻址”）可通过允许未被寻址的节点在仅检查收件人字段后即忽略该任务通告，从而降低消息处理开销。","role":"title","tier":"h1","align":"center","passthrough":false},{"text":"The saving is small, but is useful because it allows a node's communication processor alone to decide whether the rest of the message should be examined and further processed. It is also useful for reducing","src":"The saving is small, but is useful because it allows a node's communication processor alone to decide whether the rest of the message should be examined and further processed. It is also useful for reducing","dst":"此类开销节省虽小，却颇具实用价值：它使得节点的通信处理器即可独立判定是否需进一步解析并处理该消息其余部分。此外，在问题求解器的各节点之间未配置广播通信信道的情况下，该机制亦有助于降低消息通信流量。","role":"title","tier":"h1","align":"center","passthrough":false},{"text":"message traffic when the nodes of the problem solver are not interconnected with broadcast communication channels. As shown in the example, a task announcement has four","src":"message traffic when the nodes of the problem solver are not interconnected with broadcast communication channels. As shown in the example, a task announcement has four","dst":"如示例所示，一条任务通告包含四个主要字段。","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"main slots. The eligibility specification is a list of criteria that a node must meet to be eligible to submit a bid. This slot re-","src":"main slots. The eligibility specification is a list of criteria that a node must meet to be eligible to submit a bid. This slot re-","dst":"资格说明字段（eligibility specification）列出了节点须满足方可提交投标的一系列条件。该字段可——","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"To: 25","src":"To: 25","dst":"","role":"figure-label","tier":"small","align":"left","passthrough":true},{"text":"From: 42","src":"From: 42","dst":"","role":"figure-label","tier":"small","align":"left","passthrough":true},{"text":"Type: BID","src":"Type: BID","dst":"","role":"figure-label","tier":"small","align":"left","passthrough":true},{"text":"Contract: 22-3-1","src":"Contract: 22-3-1","dst":"","role":"figure-label","tier":"small","align":"left","passthrough":true},{"text":"Node Abstraction:","src":"Node Abstraction:","dst":"节点抽象：","role":"body","tier":"body","align":"left","passthrough":false},{"text":"POSITION LAT 62N LONG 9W","src":"POSITION LAT 62N LONG 9W","dst":"位置：北纬62°，西经9°","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"SENSOR NAME SI TYPES","src":"SENSOR NAME SI TYPES","dst":"传感器名称 S1 的类型","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"SENSOR NAME S2 TYPE S","src":"SENSOR NAME S2 TYPE S","dst":"传感器名称 S2 的类型","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"SENSOR NAME Ti TYPE T","src":"SENSOR NAME Ti TYPE T","dst":"传感器名称 T1 的类型","role":"body","tier":"body","align":"left","passthrough":false},{"text":"Fig. 2. Signal task bid.","src":"Fig. 2. Signal task bid.","dst":"图2：信号任务投标示意图","role":"body","tier":"body","align":"left","passthrough":false},{"text":"To: 42","src":"To: 42","dst":"","role":"figure-label","tier":"small","align":"left","passthrough":true},{"text":"From: 25","src":"From: 25","dst":"","role":"figure-label","tier":"small","align":"left","passthrough":true},{"text":"Type: AWARD","src":"Type: AWARD","dst":"","role":"figure-label","tier":"small","align":"left","passthrough":true},{"text":"Contract: 22-3-1","src":"Contract: 22-3-1","dst":"","role":"figure-label","tier":"small","align":"left","passthrough":true},{"text":"Task Specification:","src":"Task Specification:","dst":"任务说明：","role":"body","tier":"body","align":"left","passthrough":false},{"text":"SENSOR NAME S1","src":"SENSOR NAME S1","dst":"传感器名称 S1","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"SENSOR NAME S2","src":"SENSOR NAME S2","dst":"传感器名称 S2","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"Fig. 3. Signal task award.","src":"Fig. 3. Signal task award.","dst":"图3. 信号任务授标。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"duces message traffic by pruning nodes whose bids would be clearly unacceptable. In a sense, it is an extension to the addressee slot. Focused addressing can be used to restrict the possible respondents only when the manager knows the names of appropriate nodes. The eligibility specification slot is used to further restrict the possible respondents when the manager is not certain of the names of appropriate nodes, but can write a description of such nodes.\" 2 The task abstraction is a brief description of the task to be executed.","src":"duces message traffic by pruning nodes whose bids would be clearly unacceptable. In a sense, it is an extension to the addressee slot. Focused addressing can be used to restrict the possible respondents only when the manager knows the names of appropriate nodes. The eligibility specification slot is used to further restrict the possible respondents when the manager is not certain of the names of appropriate nodes, but can write a description of such nodes.\" 2 The task abstraction is a brief description of the task to be executed.","dst":"通过剪除那些投标明显不可接受的节点来减少消息通信量。从某种意义上说，这是对“收件人字段”的一种扩展。当管理者已知合适节点的名称时，可采用聚焦寻址（focused addressing）来限制可能的响应者范围；而当管理者无法确定合适节点的具体名称，但能够对这类节点进行描述时，则可利用“资格说明字段”（eligibility specification slot）进一步限定可能的响应者。“2” 任务抽象是对待执行任务的简要描述。","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"It enables a node to rank the task relative to other announced tasks. An abstraction is used rather than a complete description in order to reduce the length of the message.3 The bid specification is a description of the expected form of a bid. It enables the manager to specify the kind of information that it considers important about a node that wants to execute the task. This provides a common basis for comparison of bids and enables a node to include in a bid only the information about its capabilities that is relevant to the task, rather than a complete description.","src":"It enables a node to rank the task relative to other announced tasks. An abstraction is used rather than a complete description in order to reduce the length of the message.3 The bid specification is a description of the expected form of a bid. It enables the manager to specify the kind of information that it considers important about a node that wants to execute the task. This provides a common basis for comparison of bids and enables a node to include in a bid only the information about its capabilities that is relevant to the task, rather than a complete description.","dst":"它使节点能够将该任务与其他已发布的任务进行相对排序。采用抽象描述而非完整描述，旨在缩短消息长度。“3” 投标规范（bid specification）是对投标预期形式的说明，使管理者能够明确其认为重要的、关于拟执行该任务之节点的相关信息类型。这为投标之间的比较提供了统一基准，同时也使节点仅需在投标中提供与其执行能力相关且与任务切实有关的信息，而无需提交其能力的完整描述。","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"This both simplifies the task of the manager in evaluating bids and further reduces message traffic.","src":"This both simplifies the task of the manager in evaluating bids and further reduces message traffic.","dst":"这既简化了管理者评估投标的任务，又进一步降低了消息通信量。","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"The expiration time is a deadline for receiving bids. We assume global synchronization among the nodes. However, time is not critical in the negotiation process. For example, bids received after the expiration time of a task announcement are not catastrophic: at worst, they may result in a suboptimum selection of contractors.","src":"The expiration time is a deadline for receiving bids. We assume global synchronization among the nodes. However, time is not critical in the negotiation process. For example, bids received after the expiration time of a task announcement are not catastrophic: at worst, they may result in a suboptimum selection of contractors.","dst":"截止时间（expiration time）是接收投标的最后期限。我们假设各节点之间存在全局时间同步；然而，在协商过程中，时间并非关键因素。例如，任务公告截止时间之后收到的投标并不会造成灾难性后果：最坏情况下，仅可能导致承包商选择次优。","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"a) The Common Internode Language","src":"a) The Common Internode Language","dst":"a) 公共节点间语言","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"It is useful to encode slot information in a single high-level language understandable to all nodes We call this a common internode language. Such a language, along with a high-level programming language (for transfer of procedures between nodes), forms a common basis for communicating slot information among the nodes.","src":"It is useful to encode slot information in a single high-level language understandable to all nodes We call this a common internode language. Such a language, along with a high-level programming language (for transfer of procedures between nodes), forms a common basis for communicating slot information among the nodes.","dst":"将槽位信息编码为一种统一的高层语言，使其可被所有节点理解，这种做法十分有益；我们将该语言称为“公共节点间语言”。此类语言，连同一种高层编程语言（用于在节点间传递过程），共同构成了节点间交换槽位信息的通用基础。","role":"section","tier":"h2","align":"left","passthrough":false},{"text":"I Note that focused addressing is typically a heuristic process, since the information upon which it is based may not be exact (e.g., it may be inferred from prior responses to task announcements).","src":"I Note that focused addressing is typically a heuristic process, since the information upon which it is based may not be exact (e.g., it may be inferred from prior responses to task announcements).","dst":"需注意，聚焦式寻址通常是一种启发式过程，因其所依据的信息未必精确（例如，该信息可能系从以往对任务通告的响应中推断而来）。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"2 We will see that all messages in the protocol that can be addressed to more than one node have an addressee slot and an eligibility specification slot to accommodate addressing by name and by description.","src":"2 We will see that all messages in the protocol that can be addressed to more than one node have an addressee slot and an eligibility specification slot to accommodate addressing by name and by description.","dst":"2 我们将看到，协议中所有可发送至多个节点的消息均包含一个“收件人槽位”和一个“资格说明槽位”，以分别支持按名称寻址与按描述寻址。","role":"body","tier":"body","align":"left","passthrough":false},{"text":"3 A numerical priority measure is not, in general, sufficient to allow potential contractors to rank announced tasks. It assumes first, that all nodes agree on what constitutes an important task, and second, that the importance of a task can be captured in a one-dimensional quantity.","src":"3 A numerical priority measure is not, in general, sufficient to allow potential contractors to rank announced tasks. It assumes first, that all nodes agree on what constitutes an important task, and second, that the importance of a task can be captured in a one-dimensional quantity.","dst":"3 数值型优先级度量通常不足以使潜在承包方对已通告的任务进行排序。它首先预设所有节点对“何为重要任务”达成共识，其次还预设任务的重要性可用单一维度的量值予以表征。","role":"body","tier":"body","align":"left","passthrough":false}]}]};

function renderMd(text) {
  const raw = String(text || '');
  if (!raw.trim()) return '';
  try {
    const html = marked.parse(raw, { breaks: true, gfm: true });
    return DOMPurify.sanitize(html);
  } catch (e) {
    return DOMPurify.sanitize(raw.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])));
  }
}

function paraHtml(p) {
  const cls = ['row', 'role-' + p.role, 'tier-' + p.tier, 'align-' + p.align];
  if (p.passthrough) cls.push('passthrough');
  const dst = p.dst
    ? renderMd(p.dst)
    : p.passthrough
      ? '<span style="color:#8a8a90">' + escapeText(p.src) + '</span>'
      : '<span class="missing-dst">（待翻译）</span>';
  const src = '<div class="col-src">' + DOMPurify.sanitize(escapeText(p.src)) + '</div>';
  return '<div class="' + cls.join(' ') + '">' + src + '<div class="col-dst">' + dst + '</div></div>';
}
function escapeText(s) {
  return String(s || '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
}

const pagesEl = document.getElementById('pages');
pagesEl.innerHTML = DATA.pages.map((page) => {
  return '<section class="card"><div class="page-tag">Page ' + page.pageNo + '</div>'
    + page.paras.map(paraHtml).join('') + '</section>';
}).join('');
